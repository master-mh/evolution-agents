name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run test suite (incl. Charter property tests, SPEC.md §0.1)
        run: pytest

      - name: Verify golden run (SPEC.md §26)
        run: mitosis verify-golden-run
