[project]
name = "mitosis"
version = "0.1.0"
description = "MITOSIS colony kernel — Phase 1 deterministic kernel"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
]

[project.scripts]
mitosis = "mitosis.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mitosis = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
