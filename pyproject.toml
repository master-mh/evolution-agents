[project]
name = "mitosis"
version = "0.1.0"
description = "MITOSIS colony kernel — Phase 1 deterministic kernel"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
]

[project.scripts]
mitosis = "mitosis.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.16",
]
# The paid provider. Optional on purpose: the kernel, the full test suite, and
# `mitosis verify-golden-run` all run without it — nothing in Phase 1–3 needs
# a paid API, per §30.1 "mock before paid APIs". Install it only when the
# colony is meant to spend real money.
anthropic = [
    "anthropic>=0.40",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mitosis = ["migrations/*.sql", "golden_expectations.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Deliberately narrow: runtime-defect classes only (undefined names E9/F82,
# syntax-shaped errors F63/F7) rather than the ~339 findings a broad/default
# Ruff run reports across this repo, predominantly import ordering and
# Python-modernisation suggestions. Broadening this selection is a separate,
# mechanical change, not bundled with behavioural work (implementation
# brief, Slice D).
select = ["E9", "F63", "F7", "F82"]
